name: CI

on:
  push:
  pull_request:

jobs:
  fmt:
    name: rustfmt (solutions) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting of solution files
        shell: bash
        run: rustfmt --check --edition 2024 solutions/*/*.rs

  dev-check:
    name: rustlings dev check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Clone upstream rustlings at the tracked commit
        shell: bash
        run: |
          UPSTREAM_COMMIT="$(cat commit-hash.txt)"
          git init upstream
          git -C upstream fetch --depth 1 "https://github.com/rust-lang/rustlings.git" "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

      - name: Restore cargo caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            upstream/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('upstream/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build rustlings binary
        working-directory: upstream
        run: cargo build --release --bin rustlings

      - name: Run dev check
        shell: bash
        run: |
          BIN="upstream/target/release/rustlings"
          if [ -f "$BIN.exe" ]; then
            BIN="$BIN.exe"
          fi
          "./$BIN" dev check
