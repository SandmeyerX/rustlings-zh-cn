name: CI

on:
  push:
  pull_request:

jobs:
  fmt:
    name: rustfmt (solutions) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting of solution files
        shell: bash
        run: rustfmt --check --edition 2024 solutions/*/*.rs

  dev-check:
    name: rustlings dev check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Clone upstream rustlings at the tracked commit
        shell: bash
        run: |
          UPSTREAM_COMMIT="$(cat commit-hash.txt)"
          git init upstream
          git -C upstream fetch --depth 1 "https://github.com/rust-lang/rustlings.git" "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # 同时缓存根项目和 upstream 子项目的构建产物
          workspaces: |
            . -> target
            upstream -> target
          # 即使 dev check 超时失败也保存缓存，避免下次仍然完全冷启动
          cache-on-failure: true

      - name: Build rustlings binary
        working-directory: upstream
        run: cargo build --release --bin rustlings

      - name: Run dev check
        shell: bash
        run: |
          BIN="upstream/target/release/rustlings"
          if [ -f "$BIN.exe" ]; then
            BIN="$BIN.exe"
          fi
          "./$BIN" dev check
