name: Track Rustlings Translation Changes

on:
  schedule:
    # 北京时间每周四0点（UTC时间每周三16点）
    - cron: '0 16 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream
        run: |
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/rust-lang/rustlings.git
          fi
          git fetch --no-tags --filter=blob:none upstream main

      - name: Compare translation-relevant commits
        id: compare
        run: |
          if [ -s commit-hash.txt ]; then
            LAST=$(cat commit-hash.txt)
          else
            LAST=$(git rev-list --max-parents=0 upstream/main | tail -n 1)
          fi
          # 容错：commit-hash.txt 中的提交不在上游历史时，回退到上游首个提交
          if ! git cat-file -e "${LAST}^{commit}" 2>/dev/null; then
            LAST=$(git rev-list --max-parents=0 upstream/main | tail -n 1)
          fi
          HEAD=$(git rev-parse upstream/main)
          # 只统计翻译相关路径（exercises/、info.toml、README.md）；
          # src/、Cargo.toml 等源码与依赖层面的改动不会触发状态更新
          RELEVANT=$(git log --oneline ${LAST}..${HEAD} -- exercises/ info.toml README.md)
          if [ -n "$RELEVANT" ]; then
            echo "status=NEED_UPDATE" >> "$GITHUB_OUTPUT"
            echo "count=$(printf '%s\n' "$RELEVANT" | grep -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "status=UP_TO_DATE" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          # 生成表格格式的待同步清单（短hash链接/标题/时间），%s 中的 | 转义避免破坏表格
          TABLE=$(git log --format="%h%x09%s%x09%ad" --date=short ${LAST}..${HEAD} -- exercises/ info.toml README.md | awk -F'\t' '{ gsub(/\|/, "\\|", $2); printf "| [%s](https://github.com/rust-lang/rustlings/commit/%s) | %s | %s |\n", $1, $1, $2, $3 }')
          {
            echo "table<<EOF"
            printf '%s\n' "$TABLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Mark outdated
        if: steps.compare.outputs.status == 'NEED_UPDATE'
        run: |
          sed -i 's|https://img.shields.io/badge/track[^)]*|https://img.shields.io/badge/track-版本落后待更新-red|' README.md
          cat > tracking.md <<EOF
          # 翻译同步追踪

          - 最后同步的上游提交：[$(echo ${{ steps.compare.outputs.last }} | cut -c1-12)](https://github.com/rust-lang/rustlings/commit/${{ steps.compare.outputs.last }})（commit-hash.txt）
          - 上游最新提交：[$(echo ${{ steps.compare.outputs.head }} | cut -c1-12)](https://github.com/rust-lang/rustlings/commit/${{ steps.compare.outputs.head }})
          - 待同步的翻译相关提交（${{ steps.compare.outputs.count }} 个）：

          | Commit | 标题 | 时间 |
          | --- | --- | --- |
          ${{ steps.compare.outputs.table }}

          > commit-hash.txt 只在合并翻译后手动推进；本文件由工作流自动维护。
          EOF

      - name: Mark up-to-date
        if: steps.compare.outputs.status == 'UP_TO_DATE'
        run: |
          sed -i 's|https://img.shields.io/badge/track[^)]*|https://img.shields.io/badge/track-当前已为最新版本-green|' README.md
          cat > tracking.md <<EOF
          # 翻译同步追踪

          - 最后同步的上游提交：[$(echo ${{ steps.compare.outputs.last }} | cut -c1-12)](https://github.com/rust-lang/rustlings/commit/${{ steps.compare.outputs.last }})
          - 上游最新提交：[$(echo ${{ steps.compare.outputs.head }} | cut -c1-12)](https://github.com/rust-lang/rustlings/commit/${{ steps.compare.outputs.head }})
          - 翻译状态：已同步至最新

          > commit-hash.txt 只在合并翻译后手动推进；本文件由工作流自动维护。
          EOF

      - name: Commit badge & tracking
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md tracking.md
          if [ "${{ steps.compare.outputs.status }}" = "NEED_UPDATE" ]; then
            git commit -m "track: 上游翻译内容更新，等待同步（${{ steps.compare.outputs.count }} 个提交）" || echo "no changes"
          else
            git commit -m "track: 已同步至 ${{ steps.compare.outputs.head }}" || echo "no changes"
          fi
          git push
