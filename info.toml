[[exercises]]
name = "variables1"
dir = "01_variables"
test = false
hint = """
`main` 函数中的声明（declaration）是不是缺少了什么？
比如 Rust 中创建新变量绑定（variable binding）所需的关键字。"""

[[exercises]]
name = "variables2"
dir = "01_variables"
test = false
hint = """
编译器的消息表明，Rust 无法从代码中推断出变量 `x` 所具有的类型。
要是在 `main` 函数的第一行添加类型注解会怎样呢？
如果给 `x` 赋予一个值又会如何呢？
要是这两件事都做了，又会变成什么样呢？
另外，`x` 应该是什么类型呢？
要是 `x` 和 `10` 是相同类型会怎样？如果是不同类型又会怎样呢？"""

[[exercises]]
name = "variables3"
dir = "01_variables"
test = false
hint = """
在本练习中，我们在 `main` 函数中创建了一个变量绑定，并在下一行就尝试使用它，但还没有给它赋任何值。

注意，不存在的值无法打印出来，试着给 `x` 赋一个值吧！

这是各类编程语言中极易犯下、还容易埋下隐患的错误 -- 值得庆幸的是，Rust 编译器提前帮我们拦截了这类问题。"""

[[exercises]]
name = "variables4"
dir = "01_variables"
test = false
hint = """
在 Rust 中，变量绑定默认是不可变（immutable）的。
但这里我们尝试对 `x` 重新赋予新值。
有一个关键字可以将变量绑定声明为可变（mutable）类型。"""

[[exercises]]
name = "variables5"
dir = "01_variables"
test = false
hint = """
在 `variables4` 中，我们学习了如何使用特定关键字来把不可变变量变成可变变量。
但在本题中，这么做可行不通。
因为这次我们想给已有变量赋予一个不同类型的值。
而且有时可能会希望复用原有变量名，只是对值做类型转换，本题就是这种场景。

好在 Rust 为此提供了一个实用方案：`遮蔽（Shadowing）`。
遮蔽在《Rust 程序设计语言》简体中文版中有详细讲解：
https://kaisery.github.io/trpl-zh-cn/ch03-01-variables-and-mutability.html#遮蔽
（社区中文翻译，原文：https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing）

试着用遮蔽的思路完成本题。"""

[[exercises]]
# Exercise name which is the exercise file name without the `.rs` extension.
