[[exercises]]
name = "errors5"
dir = "13_error_handling"
test = false
hint = """`main` 函数内部会产生两种不同的 `Result` 类型，它们都通过 `?` 运算符传播。如何为 `main` 函数声明一个同时允许这两种类型的返回类型呢？

在底层，`?` 运算符会对错误值调用 `From::from`，将其转换为装箱后的特征对象 `Box<dyn Error>`。
这个装箱后特征对象是多态的，由于所有错误都实现了 `Error` 特征，因此我们可以用这一种 `Box` 对象捕获各种不同的错误。

请参阅《Rust 程序设计语言》的这一节：
https://kaisery.github.io/trpl-zh-cn/ch09-02-recoverable-errors-with-result.html#-运算符快捷方式
（社区中文翻译，原文：https://doc.rust-lang.org/book/ch09-02-recoverable-errors-with-result.html#a-shortcut-for-propagating-errors-the--operator）

了解更多关于装箱错误（boxing errors）的内容：
https://rustwiki.org/zh-CN/rust-by-example/error/multiple_error_types/boxing_errors.html （社区中文翻译，原文：https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/boxing_errors.html）

了解更多关于将 `?` 运算符与装箱错误结合使用的内容：
https://rustwiki.org/zh-CN/rust-by-example/error/multiple_error_types/reenter_question_mark.html （社区中文翻译，原文：https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/reenter_question_mark.html）"""

