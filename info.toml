'                      __  ___                 
'     _______  _______/ /_/ (_)___  ____ ______
'    / ___/ / / / ___/ __/ / / __ \\/ __ `/ ___/     ~
'   / /  / /_/ (__  ) /_/ / / / / / /_/ (__  )     ___
'  /_/   \\__,_/____/\\__/_/_/_/ /_/\\__, /____/     ['_']  
'                                /____/       /=) zh-CN (=\\  
'                                                 -----
'                                                 || ||
'                                                 ~~ ~~
初次使用？别担心，Rustlings 就是为编程新手量身打造的学习工具！
我们会带你系统学习 Rust 的各类知识点，但正式开始前，让我们先了解一下 Rustlings 的使用规则：

1. Rustlings 的核心模式就是做练习。
    习题代码一般存在编译错误或逻辑错误，会导致编译、测试失败。
    你的任务就是找出并修复全部错误。
2. 请在当前文件夹打开代码编辑器。
    进度条下方会显示当前习题的文件路径，在编辑器打开对应习题文件，修改错误后保存。
    Rustlings 会自动检测文件改动并重新校验习题。
    当所有问题修复完成后，程序会提示你进入下一题。
3. 练习卡壳时，在终端键入 `h` 即可查看提示。
4. 如果你觉得某道习题逻辑晦涩难以理解，可以前往 GitHub 提交 Issue（https://github.com/SandmeyerX/rustlings-zh-cn/）。
    我会逐一查看，同时其他学习者也能在此交流讨论、互相答疑。
"""

