[[exercises]]
name = "functions5"
dir = "02_functions"
test = false
hint = """这是一个非常常见的错误，只需删除一个字符即可修复。
它发生的原因是 Rust 区分表达式（expression）和语句（statement）：
表达式会基于自身操作数（operand）运算得出返回值，而语句只会返回 `()` 类型，其行为类似于 C/C++ 中的 `void`。

我们希望 `square` 函数返回 `i32` 类型的值，但它却返回了 `()` 类型。

有两种解决方案：
1. 在 `num * num;` 前添加 `return` 关键字
2. 删除 `num * num` 后的分号 `;`"""

[[exercises]]
name = "if1"
dir = "03_if"
hint = """如果你愿意的话，也可以只用一行代码来实现！

其他语言中类似的例子：
- 在 C/C++ 中：`a > b ? a : b`
- 在 Python 中：`a if a > b else b`

在 Rust 中需要牢记以下几点：
- `if` 判断条件两侧无需用圆括号包裹
- `if`/`else` 条件分支属于表达式，具备返回值
- 每个条件分支后使用大括号 `{}` 包裹代码块"""

