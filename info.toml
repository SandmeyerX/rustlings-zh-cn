要进行此更改，需要以下操作：
- 更新函数签名中的返回类型为 `Result<String, String>`，其变体可以是 `Ok(String)` 和 `Err(String)`。
- 将函数体中返回 `Some(...)` 的地方改为返回 `Ok(...)`。
- 将函数体中返回 `None` 的地方改为返回 `Err(错误消息)`。"""

