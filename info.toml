元组结构体（tuple struct）本质上是带类型名称的元组。

最后是单元结构体（unit struct），它没有任何字段，在泛型场景中很有用。

在本练习中，你需要完成并实现每一种结构体。想了解更多，请查看《Rust 程序设计语言》：
https://kaisery.github.io/trpl-zh-cn/ch05-01-defining-structs.html
