dir = "01_variables"
test = false
hint = """
你可以在官方教程《变量与可变性》章节的「常量」小节，深入了解常量，以及常量和普通变量的区别。

我们已经学习了普通变量和可变性，不过还存在一种重要的变量类型：常量。

常量始终是不可变的，并且使用 `const` 关键字（而不是 `let`）进行声明。

值得注意的是，常量在代码中必须显式标注类型。

关于变量和常量的区别，在《Rust 程序设计语言》简体中文版中有详细讲解：
https://kaisery.github.io/trpl-zh-cn/ch03-01-variables-and-mutability.html#常量
（社区中文翻译，原文：https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants）"""

