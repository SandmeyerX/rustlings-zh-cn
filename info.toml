[[exercises]]
name = "conversions2"
dir = "23_conversions"
hint = """从华氏度转换为摄氏度的公式是: C = (F - 32) / 1.8
这个公式可以从第一个公式推导出来:

             F = C * 1.8 + 32   // 现在两边同时减去 32
        F - 32 = C * 1.8        // 然后两边同时除以 1.8
(F - 32) / 1.8 = C
"""

[[exercises]]
name = "conversions3"
dir = "23_conversions"
hint = """在`FromStr`的实现中，需要指定`Person`对象并返回`Ok`，如果字符串不符合要求则指定相应错误并返回`Err`。这与 `conversions2` 的练习大致相同，不过这里是返回错误而不是返回默认值。
另一个提示:
可以使用 `Result` 的 `map_err` 方法以及在闭包中使用它来包装从 `parse::<u8>` 产生的错误。
还有一个提示:
如果想要利用 `?` 运算符来传播错误，请参考以下内容:
https://doc.rust-lang.org/stable/rust-by-example/error/multiple_error_types/reenter_question_mark.html """

