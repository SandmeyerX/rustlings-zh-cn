[[exercises]]
name = "move_semantics1"
dir = "06_move_semantics"
hint = """你在向动态数组 push 元素的那一行，会看到“cannot borrow `vec` as mutable, as it is not declared as mutable”（`vec` 未声明为可变，因此不能作为可变借用）这样的错误，对吧？

修复方法是添加一个关键字，而且不是添加在 push 元素的那一行（也就是报错的那一行）。

试试在调用 `fill_vec()` 之后继续访问变量 `vec0`，看看会发生什么！"""

[[exercises]]
name = "move_semantics2"
dir = "06_move_semantics"
hint = """第一次运行这个练习时，你会看到一个“borrow of moved value”（借用了已移动的值）之类的错误。

在 Rust 中，当参数被传递给函数，并且没有被显式返回时，原来的变量就无法再使用了，我们称这个过程为“移动”（moving）变量。
当把 `vec0` 传给 `fill_vec` 时，它被“移动”到 `vec1`，意味着我们无法再访问 `vec0`。

你也可以创建一份与 `vec0` 中数据相同的独立副本，然后把它传给 `fill_vec`。这在 Rust 中叫做克隆（cloning）。"""

