test = false
hint = """Rust的标准库中存储了长精度和无限精度的数学常数:
https://doc.rust-lang.org/stable/std/f32/consts/index.html 
在某些情况下，可能想要使用某种数学常数的自定义近似值，但Clippy会将不准确的数学常数视为潜在错误的原因。请参考编译输出中的Clippy警告，从 `std::f32::consts` 中使用合适的替换常数。"""

